<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Me</title>

    <style>
       .hidden-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 20px;
}

.message {
    font-size: clamp(18px, 3vw, 28px);
    letter-spacing: 1px;
    max-width: 700px;
    text-align: center;
}

.smileys {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
}

.face {
    width: 55px;
    height: 55px;
    border: 2px solid #aaa;
    border-radius: 50%;
    position: relative;

    animation: loadingBounce 1.2s ease-in-out infinite;
}

.face:nth-child(2) {
    animation-delay: 0.2s;
}

.face:nth-child(3) {
    animation-delay: 0.4s;
}

.eyes::before,
.eyes::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    background: #aaa;
    border-radius: 50%;
    top: 17px;
}

.eyes::before {
    left: 14px;
}

.eyes::after {
    right: 14px;
}

.mouth {
    position: absolute;
    width: 20px;
    height: 10px;
    border-bottom: 2px solid #aaa;
    border-radius: 50%;
    left: 16px;
    top: 27px;
}

@keyframes loadingBounce {
    0%, 100% {
        transform: translateY(0);
        border-color: #555;
    }

    30% {
        transform: translateY(-15px);
        border-color: #fff;
    }

    60% {
        transform: translateY(0);
        border-color: #aaa;
    }
}

@media (prefers-reduced-motion: reduce) {
    .face {
        animation: none;
    }
}
    </style>
</head>
<body>

    <div class="hidden-page">

        <div class="smileys">
            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>

            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>

            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>
        </div>

        <p class="message">
            Sorry, This page is hidden for the moment.<br>
            Please check later!
        </p>

    </div>

</body>
</html>
