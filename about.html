<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Me</title>

    <style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: #b0b0b0;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.hidden-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 32px;
    padding: 24px;
}

.message {
    max-width: 650px;
    margin: 0;
    color: #999999;
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1.8;
}

.smileys {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
}

.face {
    width: 48px;
    height: 48px;
    position: relative;
    border: 2px solid #666666;
    border-radius: 50%;
    animation: loadingBounce 1.2s ease-in-out infinite;
}

.face:nth-child(2) {
    animation-delay: 0.2s;
}

.face:nth-child(3) {
    animation-delay: 0.4s;
}

.eyes::before,
.eyes::after {
    content: "";
    position: absolute;
    top: 14px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #888888;
}

.eyes::before {
    left: 12px;
}

.eyes::after {
    right: 12px;
}

.mouth {
    position: absolute;
    top: 24px;
    left: 13px;
    width: 18px;
    height: 9px;
    border-bottom: 2px solid #888888;
    border-radius: 50%;
}

@keyframes loadingBounce {
    0%, 100% {
        transform: translateY(0);
        border-color: #444444;
    }

    30% {
        transform: translateY(-10px);
        border-color: #999999;
    }

    60% {
        transform: translateY(0);
        border-color: #666666;
    }
}

@media (prefers-reduced-motion: reduce) {
    .face {
        animation: none;
    }
}

    </style>
</head>
<body>

    <div class="hidden-page">

        <div class="smileys">
            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>

            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>

            <div class="face">
                <span class="eyes"></span>
                <span class="mouth"></span>
            </div>
        </div>

        <p class="message">
            Sorry, This page is hidden for the moment.<br>
            Please check later!
        </p>

    </div>

</body>
</html>
