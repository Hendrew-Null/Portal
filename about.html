
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Me — Hendrew Hilary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: fadeIn 1s ease forwards;
        }

        .navigation {
            position: absolute;
            top: 30px;
            left: 8%;
            right: 8%;

            display: flex;
            justify-content: flex-end;
            gap: 30px;
        }

        .navigation a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .navigation a:hover {
            color: white;
        }

        .construction {
            text-align: center;
            padding: 20px;
            animation: appear 1.2s ease forwards;
        }

        .smileys {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 35px;
        }

        .face {
            width: 55px;
            height: 55px;
            border: 2px solid #aaa;
            border-radius: 50%;
            position: relative;

            animation: loadingBounce 1.2s ease-in-out infinite;
        }

        .face:nth-child(1) {
            animation-delay: 0s;
        }

        .face:nth-child(2) {
            animation-delay: 0.2s;
        }

        .face:nth-child(3) {
            animation-delay: 0.4s;
        }

        .eyes {
            position: absolute;
            top: 16px;
            left: 13px;
            width: 5px;
            height: 5px;
            background: #aaa;
            border-radius: 50%;
            box-shadow: 20px 0 #aaa;
        }

        .mouth {
            position: absolute;
            left: 16px;
            top: 25px;
            width: 19px;
            height: 10px;
            border-bottom: 2px solid #aaa;
            border-radius: 50%;
        }

        .construction p {
            color: #777;
            font-size: 16px;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loadingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                border-color: #555;
            }

            30% {
                transform: translateY(-15px);
                border-color: #fff;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .face {
                animation: none;
            }
        }
    </style>
</head>
