<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creation — Hendrew Hilary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: fadeIn 1s ease forwards;
        }

        .construction {
            text-align: center;
            animation: appear 1.2s ease forwards;
        }

        .construction h1 {
            font-size: clamp(35px, 6vw, 70px);
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .construction p {
            color: #777;
            font-size: 16px;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navigation {
    position: absolute;
    top: 30px;
    left: 8%;
    right: 8%;

    display: flex;
    justify-content: flex-end;
    gap: 30px;
}

.navigation a {
    color: #888;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color 0.3s ease;
}

.navigation a:hover {
    color: white;
}

.smileys {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-bottom: 35px;
}

.face {
    width: 55px;
    height: 55px;
    border: 2px solid #aaa;
    border-radius: 50%;
    position: relative;

    animation: loadingBounce 1.2s ease-in-out infinite;
}

/* Stagger the three faces */
.face:nth-child(1) {
    animation-delay: 0s;
}

.face:nth-child(2) {
    animation-delay: 0.2s;
}

.face:nth-child(3) {
    animation-delay: 0.4s;
}

.eyes {
    position: absolute;
    top: 16px;
    left: 13px;
    width: 5px;
    height: 5px;
    background: #aaa;
    border-radius: 50%;
    box-shadow: 20px 0 #aaa;
}

.mouth {
    position: absolute;
    left: 16px;
    top: 25px;
    width: 19px;
    height: 10px;
    border-bottom: 2px solid #aaa;
    border-radius: 50%;
}

@keyframes loadingBounce {
    0%, 60%, 100% {
        transform: translateY(0);
        border-color: #555;
    }

    30% {
        transform: translateY(-15px);
        border-color: #fff;
    }
}

@media (prefers-reduced-motion: reduce) {
    .face {
        animation: none;
    }
}
        .projects {
    width: min(850px, 84%);
    margin: 100px auto 50px;
    animation: appear 1.2s ease forwards;
}

.section-label {
    color: #666;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 14px;
}

.projects > h1 {
    font-size: clamp(35px, 6vw, 60px);
    letter-spacing: -2px;
    margin-bottom: 35px;
}

.project-card {
    border: 1px solid #292929;
    background: #111;
    text-align: left;
    transition: border-color 0.3s ease;
}

.project-card:hover {
    border-color: #555;
}

.project-preview {
    width: 100%;
    height: 350px;
    background: #080808;
    overflow: hidden;
    border-bottom: 1px solid #292929;
}

.project-preview iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #080808;
}

.project-info {
    padding: 25px;
}

.project-info h2 {
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 12px;
}

.project-time {
    color: #777;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 24px;
}

.project-link {
    display: inline-block;
    color: #aaa;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    border-bottom: 1px solid #555;
    padding-bottom: 6px;
    transition: color 0.3s ease;
}

.project-link:hover {
    color: white;
    border-color: white;
}

@media (max-width: 600px) {
    .projects {
        width: 90%;
        margin-top: 100px;
    }

    .project-preview {
        height: 260px;
    }

    .project-info {
        padding: 20px;
    }
}
    </style>
</head>

<body>

    <nav class="navigation">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT ME</a>
</nav>

    <div class="projects">

    <p class="section-label">MY PROJECTS</p>
    <h1>Digital Clock</h1>

    <div class="project-card">

        <div class="project-preview">
            <iframe
                src="https://hendrew-null.github.io/Digital-Clock/"
                title="Digital Clock website preview"
                loading="lazy">
            </iframe>
        </div>

        <div class="project-info">
            <h2>Digital Clock</h2>

            <p class="project-time">
                Estimated 9 hours project
            </p>

            <a
                class="project-link"
                href="https://hendrew-null.github.io/Digital-Clock/"
                target="_blank"
                rel="noopener noreferrer">
                VISIT PROJECT ↗
            </a>
        </div>

    </div>

</div>
</body>

</html>
